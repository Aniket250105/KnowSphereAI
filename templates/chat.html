{% extends "base.html" %}

{% block page_content %}
<div class="chat-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div>
            <h1 style="font-size: 1.5rem; font-weight: 600;">Chat with KnowSphere</h1>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Ask questions about your uploaded documents.</p>
        </div>
        <button id="newChatBtn" class="btn btn-outline">
            <i data-feather="plus"></i> New Chat
        </button>
    </div>

    <div class="card" style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 0;">
        <div id="chatMessages" class="chat-messages">
            <div class="message bot">
                <div class="bubble">
                    Hello! I'm KnowSphere AI. I can answer questions based on the documents you've uploaded. What would you like to know?
                </div>
            </div>
        </div>
        
        <div class="chat-input-area" style="display: flex; gap: 0.5rem; padding: 1rem; border-top: 1px solid var(--border); align-items: center;">
            <button class="btn btn-outline" id="chatUploadBtn" title="Upload Document" style="padding: 0 1rem; height: 38px; display: flex; align-items: center; justify-content: center;">
                <i data-feather="paperclip"></i>
            </button>
            <input type="file" id="chatFileInput" style="display: none;" accept=".pdf,.txt,.docx">
            <input type="text" id="chatInput" class="form-input" placeholder="Ask a question..." autocomplete="off" style="flex-grow: 1;">
            <button id="sendBtn" class="btn btn-primary" style="padding: 0 1.5rem; height: 38px; display: flex; align-items: center; justify-content: center;">
                <i data-feather="send"></i>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/chat.js"></script>
<style>
    .content p { margin-bottom: 0.5rem; }
    .content p:last-child { margin-bottom: 0; }
    .content pre {
        background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 4px; overflow-x: auto; margin: 0.5rem 0;
    }
    .content code {
        background: rgba(150, 150, 150, 0.2); padding: 0.1rem 0.3rem; border-radius: 3px; font-family: monospace;
    }
</style>
{% endblock %}
